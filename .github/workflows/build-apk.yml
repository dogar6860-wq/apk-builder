name: Build APK from Netlify project
run-name: Build ${{ github.event.inputs.app_name || 'APK' }} [${{ github.event.inputs.request_id || 'manual' }}]

# Put this file in your repo at: .github/workflows/build-apk.yml
# Run it from the GitHub "Actions" tab (works from a phone browser too).
#
# MODES
#   bundled (default) = site files are packed INSIDE the APK -> opens offline,
#                       and uses the internet for API calls when available.
#   live              = APK loads your live Netlify URL (always latest),
#                       shows a local "offline" page when there is no internet.

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Netlify site URL (https://yoursite.netlify.app)"
        required: true
      app_name:
        description: "App name shown on the phone"
        required: true
        default: "My App"
      app_id:
        description: "Package id (lowercase, e.g. com.suthra.myapp). Keep it the same forever."
        required: true
        default: "com.example.myapp"
      mode:
        description: "bundled (offline + online) or live"
        required: true
        default: "bundled"
        type: choice
        options: [bundled, live]
      source_dir:
        description: "bundled only: folder in THIS repo holding the site (e.g. dist, public, .). Empty = download from the URL"
        required: false
        default: ""
      build_command:
        description: "bundled only: optional build command run in repo root (e.g. npm ci && npm run build)"
        required: false
        default: ""
      permissions:
        description: "Extra Android permissions, comma separated (INTERNET + ACCESS_NETWORK_STATE are always added)"
        required: false
        default: "CAMERA,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,POST_NOTIFICATIONS,VIBRATE,READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE"
      icon_url:
        description: "Optional direct link to a square PNG icon (1024x1024 best)"
        required: false
        default: ""
      icon_path:
        description: "Used by the website: icon file inside this repo"
        required: false
        default: ""
      request_id:
        description: "Used by the website: build id"
        required: false
        default: ""
  # Optional auto trigger after each Netlify deploy. POST to
  # /repos/OWNER/REPO/dispatches with {"event_type":"netlify-deployed",
  # "client_payload":{"url":"...","app_name":"...","app_id":"..."}}
  repository_dispatch:
    types: [netlify-deployed]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      SITE_URL: ${{ github.event.inputs.url || github.event.client_payload.url }}
      APP_NAME: ${{ github.event.inputs.app_name || github.event.client_payload.app_name || 'My App' }}
      APP_ID: ${{ github.event.inputs.app_id || github.event.client_payload.app_id || 'com.example.myapp' }}
      MODE: ${{ github.event.inputs.mode || github.event.client_payload.mode || 'bundled' }}
      SOURCE_DIR: ${{ github.event.inputs.source_dir || github.event.client_payload.source_dir || '' }}
      BUILD_COMMAND: ${{ github.event.inputs.build_command || github.event.client_payload.build_command || '' }}
      PERMS: ${{ github.event.inputs.permissions || github.event.client_payload.permissions || 'CAMERA,ACCESS_FINE_LOCATION,ACCESS_COARSE_LOCATION,POST_NOTIFICATIONS,VIBRATE,READ_MEDIA_IMAGES,READ_MEDIA_VIDEO,READ_EXTERNAL_STORAGE,WRITE_EXTERNAL_STORAGE' }}
      ICON_URL: ${{ github.event.inputs.icon_url || github.event.client_payload.icon_url || '' }}
      ICON_PATH: ${{ github.event.inputs.icon_path || '' }}
      REQUEST_ID: ${{ github.event.inputs.request_id || '' }}
      RUN_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # ---------------------------------------------------------------
      # 1. Capacitor project
      # ---------------------------------------------------------------
      - name: Create Capacitor project
        run: |
          mkdir _apk && cd _apk
          npm init -y
          npm i @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7
          npm i -D @capacitor/assets
          mkdir www
          node -e '
            const fs = require("fs");
            const host = new URL(process.env.SITE_URL).host;
            const cfg = {
              appId: process.env.APP_ID,
              appName: process.env.APP_NAME,
              webDir: "www",
              // native HTTP: API calls work offline-aware and skip CORS problems
              plugins: { CapacitorHttp: { enabled: true } },
              server: process.env.MODE === "live"
                ? { url: process.env.SITE_URL, errorPath: "offline.html", allowNavigation: [host] }
                : { androidScheme: "https", allowNavigation: [host] }
            };
            fs.writeFileSync("capacitor.config.json", JSON.stringify(cfg, null, 2));
          '

      # ---------------------------------------------------------------
      # 2a. BUNDLED: put the site inside the APK (offline works)
      # ---------------------------------------------------------------
      - name: Prepare site files (bundled)
        if: env.MODE == 'bundled'
        run: |
          if [ -n "$BUILD_COMMAND" ]; then
            bash -c "$BUILD_COMMAND"
          fi
          if [ -n "$SOURCE_DIR" ]; then
            cp -r "$SOURCE_DIR"/. _apk/www/
            rm -rf _apk/www/node_modules _apk/www/.git _apk/www/_apk _apk/www/.github
          else
            wget --recursive --level=3 --no-parent --page-requisites \
                 --convert-links --adjust-extension --no-host-directories \
                 --user-agent="Mozilla/5.0" --directory-prefix=_apk/www "$SITE_URL" || true
          fi
          test -f _apk/www/index.html || { echo "No index.html found in site files"; exit 1; }

          # Make relative calls to Netlify functions / API go to the live site
          ORIGIN=$(node -e 'console.log(new URL(process.env.SITE_URL).origin)')
          cat > _apk/www/netlify-shim.js <<'EOF'
          (function () {
            var B = "__BASE__";
            function fix(u) {
              if (typeof u !== "string") return u;
              if (u.indexOf(location.origin) === 0) u = u.slice(location.origin.length);
              return /^\/(\.netlify|api)\//.test(u) ? B + u : u;
            }
            var f = window.fetch;
            if (f) {
              window.fetch = function (i, o) {
                if (typeof i === "string") i = fix(i);
                else if (i && i.url) {
                  var p = i.url.indexOf(location.origin) === 0 ? i.url.slice(location.origin.length) : i.url;
                  if (fix(p) !== p) i = new Request(fix(p), i);
                }
                return f.call(this, i, o);
              };
            }
            var x = XMLHttpRequest.prototype.open;
            XMLHttpRequest.prototype.open = function (m, u) {
              arguments[1] = fix(u);
              return x.apply(this, arguments);
            };
          })();
          EOF
          sed -i "s#__BASE__#${ORIGIN}#" _apk/www/netlify-shim.js

          node -e '
            const fs = require("fs"), path = require("path");
            const tag = "<script src=\"/netlify-shim.js\"></script>";
            function walk(d) {
              for (const f of fs.readdirSync(d)) {
                const p = path.join(d, f);
                if (fs.statSync(p).isDirectory()) walk(p);
                else if (p.endsWith(".html")) inject(p);
              }
            }
            function inject(p) {
              let s = fs.readFileSync(p, "utf8");
              if (s.includes("netlify-shim.js")) return;
              s = /<head[^>]*>/i.test(s) ? s.replace(/<head[^>]*>/i, m => m + tag) : tag + s;
              fs.writeFileSync(p, s);
            }
            walk("_apk/www");
          '

      # ---------------------------------------------------------------
      # 2b. LIVE: tiny local pages, real content comes from the URL
      # ---------------------------------------------------------------
      - name: Prepare local pages (live)
        if: env.MODE == 'live'
        run: |
          echo '<!doctype html><meta charset="utf-8"><title>Loading</title><p>Loading...</p>' > _apk/www/index.html
          cat > _apk/www/offline.html <<'EOF'
          <!doctype html>
          <html><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width,initial-scale=1">
          <title>Offline</title>
          <style>body{font-family:sans-serif;display:flex;min-height:100vh;align-items:center;justify-content:center;text-align:center;margin:0;padding:24px}button{padding:12px 24px;font-size:16px;border:0;border-radius:8px;background:#0a7;color:#fff}</style>
          </head><body><div><h2>No internet connection</h2><p>Connect to the internet and try again.</p>
          <button onclick="location.reload()">Retry</button></div></body></html>
          EOF

      # ---------------------------------------------------------------
      # 3. Android project, permissions, icon, version
      # ---------------------------------------------------------------
      - name: Add Android platform
        working-directory: _apk
        run: |
          npx cap add android
          npx cap sync android

      - name: Add permissions
        run: |
          export MANIFEST=_apk/android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import os
          p = os.environ["MANIFEST"]
          s = open(p).read()
          wanted = ["INTERNET", "ACCESS_NETWORK_STATE"] + [x.strip() for x in os.environ.get("PERMS", "").split(",") if x.strip()]
          lines = []
          for x in dict.fromkeys(wanted):
              name = x if x.startswith("android.permission.") else "android.permission." + x
              if name in s:
                  continue
              extra = ' android:maxSdkVersion="32"' if x in ("READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE") else ""
              lines.append('    <uses-permission android:name="%s"%s />' % (name, extra))
          feats = [
              '    <uses-feature android:name="android.hardware.camera" android:required="false" />',
              '    <uses-feature android:name="android.hardware.location.gps" android:required="false" />',
          ]
          s = s.replace("</manifest>", "\n".join(lines + feats) + "\n</manifest>")
          open(p, "w").write(s)
          print("\n".join(lines))
          PY

      - name: App icon (optional)
        if: env.ICON_URL != '' || env.ICON_PATH != ''
        working-directory: _apk
        run: |
          mkdir -p assets
          if [ -n "$ICON_PATH" ] && [ -f "$GITHUB_WORKSPACE/$ICON_PATH" ]; then
            cp "$GITHUB_WORKSPACE/$ICON_PATH" assets/icon.png
          elif [ -n "$ICON_URL" ]; then
            curl -fL "$ICON_URL" -o assets/icon.png
          else
            exit 0
          fi
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff'

      - name: Set version (so new builds can update old ones)
        run: |
          G=_apk/android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode $RUN_NUMBER/" $G
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.0.$RUN_NUMBER\"/" $G
          grep -E "versionCode|versionName" $G

      # ---------------------------------------------------------------
      # 4. Build + sign
      # ---------------------------------------------------------------
      - name: Build and sign APK
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_BASE64 }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          STORE_PASS: ${{ secrets.STORE_PASSWORD }}
          KEY_PASS: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p out
          cd _apk/android
          if [ -n "$KEYSTORE_B64" ]; then
            echo "Release build, signing with your keystore"
            ./gradlew assembleRelease --no-daemon
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            echo "$KEYSTORE_B64" | base64 -d > ks.jks
            KEY_PASS="${KEY_PASS:-$STORE_PASS}"
            "$BT/zipalign" -p -f 4 app/build/outputs/apk/release/app-release-unsigned.apk aligned.apk
            "$BT/apksigner" sign --ks ks.jks --ks-key-alias "$KEY_ALIAS" \
              --ks-pass env:STORE_PASS --key-pass env:KEY_PASS \
              --out "$GITHUB_WORKSPACE/out/$APP_ID-v$RUN_NUMBER.apk" aligned.apk
            rm -f ks.jks
          else
            echo "::warning::No keystore secrets found. Building a DEBUG apk; its signature changes every build, so uninstall the old app before installing a new one."
            ./gradlew assembleDebug --no-daemon
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/out/$APP_ID-v$RUN_NUMBER-debug.apk"
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ github.run_number }}
          path: out/*.apk

      - name: Publish download link (website builds)
        if: env.REQUEST_ID != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$REQUEST_ID" out/*.apk \
            --title "$APP_NAME" \
            --notes "Built from $SITE_URL ($MODE mode)" \
            --latest=false
